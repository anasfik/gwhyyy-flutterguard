# flutterguard.dev — host reverse proxy to local Docker container
# Container: gwhyyy-flutterguard-local on 127.0.0.1:8081
#
# Install (requires sudo):
#   sudo cp host-nginx-flutterguard.dev.conf /etc/nginx/sites-available/flutterguard.dev
#   sudo ln -sf /etc/nginx/sites-available/flutterguard.dev /etc/nginx/sites-enabled/flutterguard.dev
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d flutterguard.dev
#
# Pattern follows /etc/nginx/sites-available/3d and gwhyyy.com blocks:
# HTTP-only first so certbot can solve HTTP-01, then certbot adds the 443 block.

server {
    listen 80;
    listen [::]:80;
    server_name flutterguard.dev;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
