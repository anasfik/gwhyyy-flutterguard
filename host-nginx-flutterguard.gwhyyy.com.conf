# flutterguard.gwhyyy.com — redirect to canonical https://flutterguard.dev
# Cert: /etc/letsencrypt/live/flutterguard.gwhyyy.com/ (managed by Certbot)
# Single-hop: both HTTP and HTTPS go straight to https://flutterguard.dev (path preserved).
# Mirrors /etc/nginx/sites-available/flutterguard.gwhyyy.com on the VM.

server {
    listen 80;
    listen [::]:80;
    server_name flutterguard.gwhyyy.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://flutterguard.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name flutterguard.gwhyyy.com;

    ssl_certificate /etc/letsencrypt/live/flutterguard.gwhyyy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flutterguard.gwhyyy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://flutterguard.dev$request_uri;
    }
}
