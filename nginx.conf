server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # NOTE: a server-level types{} block REPLACES the image's http-level
    # mime.types entirely, so every extension we serve must be listed here.
    types {
        text/html                  html htm;
        text/css                   css;
        application/javascript     js;
        application/manifest+json  webmanifest;
        application/json           json;
        text/plain                 txt;
        text/xml                   xml;
        image/svg+xml              svg svgz;
        image/png                  png;
        image/x-icon               ico;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/xml image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    expires -1;

    error_page 404 /404.html;

    location = /404.html {
        expires -1;
    }

    location = /security.txt {
        expires -1;
    }

    location = /.well-known/security.txt {
        expires -1;
    }

    location ~* \.(?:txt|xml|webmanifest)$ {
        expires 1h;
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    location ~* \.(?:png|svg)$ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
