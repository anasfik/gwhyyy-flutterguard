map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

map $wants_markdown $not_found_page {
    default /404.html;
    1 /404.md;
}

# Never retain arbitrary path/query values in the aggregate click counter.
map $arg_p $play_page {
    default other;
    ~*^(?:/|%2f)$ /;
    ~*^(?:/|%2f)cli(?:/|%2f)$ /cli/;
    ~*^(?:/|%2f)about(?:/|%2f)$ /about/;
    ~*^(?:/|%2f)contact(?:/|%2f)$ /contact/;
    ~*^(?:/|%2f)privacy(?:/|%2f)$ /privacy/;
    ~*^(?:/|%2f)changelog(?:/|%2f)$ /changelog/;
    ~*^(?:/|%2f)flutter-security(?:/|%2f)$ /flutter-security/;
    ~*^(?:/|%2f)flutter-apk-inspection(?:/|%2f)$ /flutter-apk-inspection/;
    ~*^(?:/|%2f)proguard-flutter(?:/|%2f)$ /proguard-flutter/;
    ~*^(?:/|%2f)mobsf-alternative(?:/|%2f)$ /mobsf-alternative/;
    ~*^(?:/|%2f)flutter-security-checklist(?:/|%2f)$ /flutter-security-checklist/;
    ~*^(?:/|%2f)flutter-release-corpus(?:/|%2f)$ /flutter-release-corpus/;
}
log_format play_click escape=json '{"event":"play_cta_clicked","time":"$time_iso8601","page":"$play_page"}';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # NOTE: a server-level types{} block REPLACES the image's http-level
    # mime.types entirely, so every extension we serve must be listed here.
    types {
        text/html                  html htm;
        text/css                   css;
        application/javascript     js;
        application/manifest+json  webmanifest;
        application/json           json;
        text/plain                 txt;
        text/markdown              md;
        text/xml                   xml;
        image/svg+xml              svg svgz;
        image/png                  png;
        image/webp                 webp;
        video/mp4                  mp4;
        font/woff2                 woff2;
        image/x-icon               ico;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/xml image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://us-assets.i.posthog.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com https://us.i.posthog.com https://us-assets.i.posthog.com; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Vary "Accept" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    expires -1;

    error_page 404 $not_found_page;

    # Aggregate Play-button clicks: one log line, no cookie, no identifier.
    location = /_c/play {
        access_log /var/log/nginx/access.log play_click;
        return 204;
    }

    location = /404.html {
        expires -1;
    }

    location = /security.txt {
        expires -1;
    }

    location = /.well-known/security.txt {
        expires -1;
    }

    location ~* \.(?:txt|xml|webmanifest)$ {
        expires 1h;
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    location ~* \.(?:png|svg|webp)$ {
        expires 1d;
        try_files $uri =404;
    }

    location ~* \.mp4$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~* \.woff2$ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        if ($wants_markdown) {
            rewrite ^(?!/.*\.md$)(.*?)/?$ $1/index.md last;
        }
        try_files $uri $uri/ =404;
    }
}
